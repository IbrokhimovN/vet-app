<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vet-App Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand"><span class="brand-mark">🐾</span><span class="brand-name">vetapp</span></div>
      <h1>Admin panelga kirish</h1>
      <p class="muted">Faqat administratorlar uchun</p>
      <label>Login
        <input type="text" id="login-username" autocomplete="username" required autofocus />
      </label>
      <label>Parol
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit" class="btn-primary" id="login-btn">Kirish</button>
    </form>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">🐾</span><span class="brand-name">vetapp</span></div>
      <nav id="nav" class="nav"></nav>
      <button id="logout-btn" class="nav-item logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Chiqish</span>
      </button>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Qidirish..." />
        </div>
        <div class="topbar-right">
          <button id="bell-btn" class="icon-btn" title="Ko'rib chiqilmagan shikoyatlar">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="bell-count" class="dot" hidden>0</span>
          </button>
          <div class="me"><span id="me-avatar" class="avatar">A</span><span id="me-name">Admin</span></div>
        </div>
      </header>

      <main class="content">
        <div class="page-card">
          <div class="page-head">
            <h2 id="page-title">—</h2>
            <div id="tabs" class="tabs"></div>
          </div>
          <div id="view"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
