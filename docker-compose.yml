# Vet-App — lokal Docker stack: Postgres + Redis + Django + Celery
# Ishga tushirish:  docker compose up --build
# Web:  http://localhost:8090  (admin: /admin/, mijoz: /client/, vet: /vet/)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host 5432 band (mahalliy Postgres) — Docker DB 5433'da ochiladi.
    # Lokal dev (venv) ham shu DB'ga ulanadi: localhost:5433.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetapp -d vetapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host port chiqarilmaydi (mahalliy Redis bilan to'qnashmasligi uchun).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env.docker
    volumes:
      - .:/app                 # lokal o'zgarishlar darhol aks etadi (dev)
      - media:/app/media
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy

  # --- Telegram botlar ---
  # Ishlashi uchun .env.docker'da TOKEN va WEBAPP_URL to'ldirilgan bo'lishi shart.
  client_bot:
    build: .
    restart: unless-stopped
    command: python -m bots.client_bot
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started

  vet_bot:
    build: .
    restart: unless-stopped
    command: python -m bots.vet_bot
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  media:
